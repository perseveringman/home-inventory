<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>家居收纳 · 物品档案</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#f5f7ff', 100:'#e8edff', 500:'#5b6cff', 600:'#4a58e0', 700:'#3a46b8' },
            ink:   { 900:'#0f172a', 700:'#334155', 500:'#64748b', 300:'#cbd5e1' }
          },
          boxShadow: {
            soft: '0 1px 3px rgba(15,23,42,0.06), 0 8px 24px -8px rgba(15,23,42,0.10)'
          }
        }
      }
    }
  </script>
  <style>
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
      background: #f7f8fb;
      color: #0f172a;
      overscroll-behavior-y: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    /* 柜子标注 overlay */
    .photo-stage { position: relative; display: inline-block; line-height: 0; }
    .photo-stage img { display: block; max-width: 100%; user-select: none; -webkit-user-drag: none; }
    .cabinet-box {
      position: absolute;
      border: 2px solid #5b6cff;
      background: rgba(91,108,255,0.18);
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .cabinet-box:hover { background: rgba(91,108,255,0.30); }
    .cabinet-box .label {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      background: #5b6cff; color: #fff; font-size: 11px; padding: 2px 8px;
      border-radius: 999px; white-space: nowrap; font-weight: 600;
      box-shadow: 0 2px 6px rgba(91,108,255,0.4);
    }
    .cabinet-box.editing { border-style: dashed; border-color: #f59e0b; background: rgba(245,158,11,0.18); }
    .cabinet-box.editing .label { background: #f59e0b; }

    .draw-layer { position: absolute; inset: 0; cursor: crosshair; }
    .draw-rect {
      position: absolute; border: 2px dashed #f59e0b;
      background: rgba(245,158,11,0.20); border-radius: 4px; pointer-events: none;
    }

    /* modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,0.45);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 50;
    }
    .modal-card {
      background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(15,23,42,0.25);
      width: 100%; max-width: 520px; max-height: 90vh; overflow: auto;
    }

    /* toast */
    .toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 24px; background: #0f172a; color: #fff;
      padding: 10px 18px; border-radius: 999px; font-size: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .toast.show { opacity: 1; }

    /* tab bar */
    .tabbar {
      position: sticky; bottom: 0; background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px); border-top: 1px solid #e2e8f0;
    }
    @media (min-width: 768px) {
      .tabbar { position: static; background: transparent; border-top: none; backdrop-filter: none; }
    }

    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; font-size: 12px;
      border-radius: 999px; background: #eef2ff; color: #4a58e0; font-weight: 500; }

    /* Hide number spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="min-h-full">
  <div id="app" class="max-w-5xl mx-auto pb-24 md:pb-8"></div>

  <!-- Bottom nav -->
  <nav class="tabbar max-w-5xl mx-auto">
    <div class="flex md:justify-center md:gap-2 md:mt-6 md:border md:rounded-2xl md:bg-white md:shadow-soft md:p-1">
      <button data-route="rooms"  class="tab-btn flex-1 md:flex-none md:px-6 py-3 md:py-2 md:rounded-xl text-sm font-medium text-ink-500">
        🏠 房间
      </button>
      <button data-route="items"  class="tab-btn flex-1 md:flex-none md:px-6 py-3 md:py-2 md:rounded-xl text-sm font-medium text-ink-500">
        📦 物品
      </button>
      <button data-route="search" class="tab-btn flex-1 md:flex-none md:px-6 py-3 md:py-2 md:rounded-xl text-sm font-medium text-ink-500">
        🔍 搜索
      </button>
      <button data-route="settings" class="tab-btn flex-1 md:flex-none md:px-6 py-3 md:py-2 md:rounded-xl text-sm font-medium text-ink-500">
        ⚙️ 设置
      </button>
    </div>
  </nav>

  <div id="toast" class="toast"></div>
  <div id="modal-root"></div>

  <script src="./storage.js"></script>
  <script src="./demo.js"></script>
  <script src="./app.js"></script>
</body>
</html>
